name: release

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    runs-on: docker
    container: python:3.13-slim
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends git
      - run: git clone ${{ github.server_url }}/${{ github.repository }} .
      - run: git checkout ${{ github.sha }}
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  build-push:
    needs: test
    runs-on: docker
    env:
      # Job containers run nested inside the runner's own dind sidecar, so
      # "localhost" doesn't reach it from in here - the bridge gateway does.
      DOCKER_HOST: tcp://172.17.0.1:2375
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends git docker.io
      - run: git clone ${{ github.server_url }}/${{ github.repository }} .
      - run: git checkout ${{ github.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: forgejo.aiectomy.xyz
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: forgejo.aiectomy.xyz/pbourke/brigid:${{ github.ref_name }}
